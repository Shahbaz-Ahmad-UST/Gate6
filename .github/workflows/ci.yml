name: Shopkart CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  shopkart-test:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: shopkart_db
          MYSQL_ROOT_PASSWORD: rajasoN@0073

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prajasoN@0073"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_JDBC_URL: jdbc:mysql://localhost:3306/shopkart
      DB_USER: root
      DB_PASSWORD: rajasoN@0073
      BASE_URL: ${{ secrets.APP_BASE_URL }}
      CUSTOMER_1_NAME: ${{ secrets.CUSTOMER_1_NAME }}
      CUSTOMER_2_NAME: ${{ secrets.CUSTOMER_2_NAME }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot -prajasoN@0073 --silent && break
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done

      - name: Run Flyway Migrations
        # NOTE: requires the Flyway Gradle plugin applied in build.gradle.kts (see below)
        # and real migration scripts under src/main/resources/db/migration.
        # If you don't have migration scripts, tell me and we'll do this a different way
        # (e.g. load a schema.sql via `mysql` client instead).
        run: |
          ./gradlew flywayMigrate \
            -Dflyway.url="$DB_JDBC_URL" \
            -Dflyway.user="$DB_USER" \
            -Dflyway.password="$DB_PASSWORD" \
            -Dflyway.locations=filesystem:src/main/resources/db/migration \
            --info

      - name: Run Test Suite
        run: ./gradlew test --rerun-tasks --info
        continue-on-error: true

        env:
          JAVA_TOOL_OPTIONS: >
            -DDB_JDBC_URL=jdbc:mysql://localhost:3306/shopkart_db
            -DDB_USER=root
            -DDB_PASSWORD=rajasoN@0073
            -Dallure.results.directory=build/allure-results

      - name: Show Test Result Summary (debug)
        if: always()
        run: |
          echo "---- allure-results dir ----"
          ls -la build/allure-results 2>/dev/null || echo "MISSING: build/allure-results"
          echo "---- gradle test reports dir ----"
          find build/test-results -name "*.xml" 2>/dev/null | head -20 || echo "MISSING: build/test-results"

      - name: Upload Test Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: build/logs/test.log
          if-no-files-found: warn

      - name: Verify Allure Results
        if: always()
        run: |
          mkdir -p build/allure-results
          if [ -z "$(ls -A build/allure-results 2>/dev/null)" ]; then
            echo "::error::No Allure results found — tests likely never executed. Check the 'Run Test Suite' --info log above for class-init errors (missing env vars) or compile errors."
            exit 1
          fi

      - name: Write Allure environment info
        if: always()
        run: |
          mkdir -p build/allure-results
          cat > build/allure-results/environment.properties << ENV
          Browser=Chrome (headless)
          BaseURL=${{ secrets.APP_BASE_URL }}
          Build=${{ github.run_number }}
          OS=ubuntu-latest (GitHub Actions)
          Branch=${{ github.ref_name }}
          Commit=${{ github.sha }}
          ENV

      - name: Checkout gh-pages
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: build/allure-results
          allure_history: allure-history
          allure_report: allure-report
          keep_reports: 20
          gh_pages: gh-pages

      - name: Remove Nested Git
        if: always()
        run: sudo rm -rf allure-history/.git

      - name: Publish Allure
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Fail if Tests Failed
        if: always()
        run: |
          if [ -d build/reports/tests ] && grep -rl "FAILED" build/reports/tests --include="*.html" > /dev/null 2>&1; then
            exit 1
          fi